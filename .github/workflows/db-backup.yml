name: Daily Database Backup

on:
  schedule:
    # Runs at 3:00 AM UTC daily
    - cron: '0 3 * * *'
  workflow_dispatch: # Allows manual trigger

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Install PostgreSQL Client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Create Backup
        run: |
          # Dump the database
          pg_dump "${{ secrets.DATABASE_URL }}" -F c > backup.dump
          
          # Encrypt the backup with symmetric GPG encryption to prevent unauthorized access
          gpg --batch --yes --symmetric --cipher-algo AES256 --passphrase "${{ secrets.BACKUP_PASSWORD }}" -o backup.dump.gpg backup.dump

      - name: Upload Encrypted Backup Artifact
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_id }}
          path: backup.dump.gpg
          retention-days: 90
