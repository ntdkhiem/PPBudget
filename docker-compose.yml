version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: ppbudget_postgres
    environment:
      POSTGRES_USER: ppbudget
      POSTGRES_PASSWORD: ppbudget_password
      POSTGRES_DB: ppbudget
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
