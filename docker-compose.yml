version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: firefly_postgres
    environment:
      POSTGRES_USER: firefly
      POSTGRES_PASSWORD: firefly_password
      POSTGRES_DB: firefly
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
